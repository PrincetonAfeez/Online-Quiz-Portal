name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: quizops_test
          POSTGRES_USER: quizops
          POSTGRES_PASSWORD: ci-only-password
        options: >-
          --health-cmd "pg_isready -U quizops"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 3s --health-retries 5
        ports: ["6379:6379"]

    env:
      SECRET_KEY: ci-only-secret-key-not-used-in-production-0000000000
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://quizops:ci-only-password@localhost:5432/quizops_test
      REDIS_URL: redis://localhost:6379/1
      CELERY_BROKER_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check for missing migrations
        run: DEBUG=1 python manage.py makemigrations --check --dry-run

      - name: Migrate from zero
        run: python manage.py migrate --noinput

      - name: Test with coverage
        run: python -m pytest --cov --cov-report=term-missing

      - name: Production deployment checks
        run: python manage.py check --deploy --fail-level WARNING

      - name: Build image
        run: docker build -t quizops:${{ github.sha }} .

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dependency vulnerability audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --requirement requirements.txt --strict

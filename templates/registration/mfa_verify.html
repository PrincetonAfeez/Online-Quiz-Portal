{% extends "base.html" %}
{% block title %}Two-factor authentication - QuizOps{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Two-factor authentication</h1>
  <p class="muted">Enter the code from your authenticator app to continue.</p>
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="code">Authentication code</label>
      <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" required maxlength="8" autofocus>
    </div>
    <button class="primary-button" type="submit">Verify</button>
  </form>
</section>
{% endblock %}
